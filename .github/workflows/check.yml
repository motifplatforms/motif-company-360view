name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No brand, product, catalog or workbook terms
        run: python3 -I tools/check_terms.py .
      - name: Skills match the recorded version (no hand edits)
        run: python3 -I tools/check_repo.py .
      - name: Install pinned script dependencies
        run: pip install -r skills/company360-output-evaluation/scripts/requirements.txt
      - name: Orange title check self-test
        run: python3 tools/test_check_orange.py
